<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Chicken - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-frame flex flex-col justify-between" style="background: linear-gradient(180deg, #f97316 0%, #c2410c 100%);">
        <div class="p-4 flex items-center">
            <a href="index.html" class="text-white text-lg"><i class="fa-solid fa-chevron-left"></i></a>
        </div>

        <div class="flex flex-col items-center pb-4">
            <div class="w-28 h-28 bg-white rounded-full flex items-center justify-center shadow-lg border-2 border-amber-300 mb-2">
                <img src="images/logo.png" alt="Campus Chicken logo" class="w-full h-full rounded-full object-cover">
            </div>
            <h2 class="text-xs text-amber-200 tracking-widest font-semibold uppercase">Campus Chicken SmartStall</h2>
        </div>

        <div class="bg-white rounded-t-[2.5rem] p-6 space-y-4 shadow-2xl flex-grow flex flex-col justify-center">
            <h3 class="text-center font-bold text-slate-800 text-lg mb-2">Welcome Back!</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] text-slate-500 font-bold block mb-1">Email Address</label>
                    <input type="email" id="login-email" placeholder="e.g. prettypatty@gmail.com" class="w-full bg-slate-100 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold block mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="login-password" placeholder="Password (>8 chars & numbers)" class="w-full bg-slate-100 border border-slate-200 rounded-xl p-3 pr-10 text-xs outline-none focus:border-orange-500">
                        <button type="button" onclick="togglePassword('login-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
                            <i class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                    <span id="login-error" class="text-[10px] text-red-500 hidden mt-1 block"></span>
                </div>
            </div>
            <button onclick="handleLogin()" class="block w-full text-center bg-gradient-to-r from-amber-400 to-amber-500 text-slate-900 font-bold py-3 rounded-xl shadow-md text-xs mt-4">
                Log in
            </button>
            <button type="button" onclick="resetCustomerPassword()" class="w-full text-center text-orange-600 font-bold text-[10px] pt-2">Forgot password?</button>
            <p class="text-center text-[10px] text-slate-500 pt-2">
                Don't have an account? <a href="signup.html" class="text-orange-600 font-bold">Sign up</a>
            </p>
        </div>
    </div>

    <script src="app-ui.js"></script>
    <script>
        function togglePassword(fieldId, btn) {
            let input = document.getElementById(fieldId);
            let icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showLoginError(message, field) {
            let errSpan = document.getElementById('login-error');
            errSpan.innerText = message;
            errSpan.classList.remove('hidden');
            document.getElementById('login-email').style.borderColor = field === 'email' ? "#ef4444" : "";
            document.getElementById('login-password').style.borderColor = field === 'password' ? "#ef4444" : "";
        }

        function handleLogin() {
            let email = document.getElementById('login-email').value.trim().toLowerCase();
            let pass = document.getElementById('login-password').value;

            if(!email || !pass) {
                alert("Please fill in all fields.");
                return;
            }

            let registeredUsers = JSON.parse(localStorage.getItem('cc_registered_users') || '[]');
            let user = registeredUsers.find(u => String(u.email).toLowerCase() === email);

            if(!user) {
                showLoginError("Account not found. Please sign up first.", 'email');
                return;
            }
            if(user.pass !== pass) {
                showLoginError("Incorrect password. Please try again.", 'password');
                return;
            }

            localStorage.setItem('logged_customer_name', user.fname + " " + user.lname);
            localStorage.setItem('logged_customer_email', user.email);
            window.location.href = "customer.html";
        }
    </script>
</body>
</html>
