<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Chicken - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-frame flex flex-col justify-between" style="background: linear-gradient(180deg, #f97316 0%, #c2410c 100%);">
        <div class="p-4 flex items-center">
            <a href="index.html" class="text-white text-lg"><i class="fa-solid fa-chevron-left"></i></a>
        </div>

        <div class="flex flex-col items-center pb-2">
            <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-lg border-2 border-amber-300 mb-2">
                <img src="images/logo.png" alt="Campus Chicken logo" class="w-full h-full rounded-full object-cover">
            </div>
            <h2 class="text-xs text-amber-200 tracking-widest font-semibold uppercase">Admin Portal</h2>
        </div>

        <!-- White card overlay container -->
        <div class="bg-white rounded-t-[2.5rem] p-6 space-y-3 shadow-2xl flex-grow flex flex-col justify-center">
            <h3 class="text-center font-bold text-slate-800 text-sm mb-1">Staff Authentication</h3>
            
            <div class="space-y-2.5">
                <div>
                    <label class="text-[10px] text-slate-500 font-bold block mb-1">Staff Full Name</label>
                    <input type="text" id="admin-name" placeholder="e.g. Chef Juan" class="w-full bg-slate-100 border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold block mb-1">Employee ID (Format: EMP-YYYY-NNN)</label>
                    <input type="text" id="admin-id" placeholder="e.g. EMP-2026-001" class="w-full bg-slate-100 border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500">
                    <span id="admin-id-error" class="text-[9px] text-red-500 hidden mt-1 block">Invalid Employee ID format. Must match EMP-YYYY-NNN.</span>
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold block mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="admin-pass" placeholder=">8 chars with numbers" class="w-full bg-slate-100 border border-slate-200 rounded-xl p-2.5 pr-10 text-xs outline-none focus:border-orange-500">
                        <button type="button" onclick="togglePassword('admin-pass', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
                            <i class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                    <span id="admin-pass-error" class="text-[9px] text-red-500 hidden mt-1 block">Password must be >8 characters and contain numbers.</span>
                </div>
            </div>

            <button onclick="validateAdminLogin()" class="w-full bg-gradient-to-r from-amber-400 to-amber-500 text-slate-900 font-bold py-3 rounded-xl shadow-md text-xs mt-2">
                Log In to Admin Dashboard
            </button>
        </div>
    </div>

    <script src="app-ui.js"></script>
    <script>
        function togglePassword(fieldId, btn) {
            let input = document.getElementById(fieldId);
            let icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function validateAdminLogin() {
            let name = document.getElementById('admin-name').value.trim();
            let empId = document.getElementById('admin-id').value.trim();
            let pass = document.getElementById('admin-pass').value;
            let idErr = document.getElementById('admin-id-error');
            let passErr = document.getElementById('admin-pass-error');

            idErr.classList.add('hidden');
            passErr.classList.add('hidden');

            if (!name || !empId || !pass) {
                alert("Please fill in all fields.");
                return;
            }

            let empIdPattern = /^EMP-\d{4}-\d{3}$/;
            if (!empIdPattern.test(empId)) {
                idErr.classList.remove('hidden');
                document.getElementById('admin-id').style.borderColor = "#ef4444";
                return;
            }

            let hasNumber = /\d/.test(pass);
            let isValidLength = pass.length > 8;

            if (!isValidLength || !hasNumber) {
                passErr.classList.remove('hidden');
                document.getElementById('admin-pass').style.borderColor = "#ef4444";
                return;
            }

            localStorage.setItem('logged_employee_name', name);
            localStorage.setItem('logged_employee_id', empId);
            window.location.href = "admin_2.html";
        }
    </script>
</body>
</html>
