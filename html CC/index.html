<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Chicken SmartStall - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-frame flex flex-col justify-between" style="background: linear-gradient(180deg, #f97316 0%, #f8d226 100%);">
        <div class="flex-grow flex flex-col items-center justify-center px-8 text-center">
            <div class="w-40 h-40 bg-white rounded-full flex items-center justify-center shadow-2xl border-4 border-amber-300 mb-5">
                <img src="images/logo.png" alt="Campus Chicken logo" class="w-full h-full rounded-full object-cover">
            </div>
            <h1 class="text-white font-extrabold text-2xl leading-tight">Campus Chicken<br>SmartStall</h1>
            <p class="text-amber-200 text-xs mt-2 tracking-wide">Skip the line, savor the time.</p>
            <span class="mt-3 text-[10px] text-white/80 bg-white/15 px-3 py-1 rounded-full">Bulacan State University | Smart Stall</span>
        </div>

        <div class="bg-white rounded-t-[2.5rem] p-7 space-y-3 shadow-2xl">
            <h2 class="text-center font-bold text-slate-800 text-base">Welcome!</h2>
            <p class="text-center text-[11px] text-slate-500 pb-1">Log in or create an account to order from the stall.</p>
            <a href="login.html" class="block w-full text-center bg-gradient-to-r from-amber-400 to-amber-500 text-slate-900 font-bold py-3.5 rounded-xl shadow-md text-sm">
                <i class="fa-solid fa-right-to-bracket mr-1"></i> Log in
            </a>
            <a href="signup.html" class="block w-full text-center bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl shadow-md text-sm">
                <i class="fa-solid fa-user-plus mr-1"></i> Sign up
            </a>
            <p class="text-center text-[10px] text-slate-400 pt-2">
                Stall staff? <a href="admin_login.html" class="text-orange-600 font-bold">Admin portal</a>
            </p>
        </div>
    </div>
</body>
</html>
