<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Chicken - Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-frame flex flex-col" style="background: linear-gradient(180deg, #f97316 0%, #c2410c 100%);">
        <div class="p-4 flex items-center">
            <a href="index.html" class="text-white text-lg"><i class="fa-solid fa-chevron-left"></i></a>
        </div>
        <div class="text-center pb-1">
            <div class="w-14 h-14 bg-white rounded-full mx-auto flex items-center justify-center shadow-md">
                <img src="images/logo.png" alt="Campus Chicken logo" class="w-full h-full rounded-full object-cover">
            </div>
        </div>

        <div class="bg-white rounded-t-[2.5rem] p-6 space-y-3 flex-grow overflow-y-auto shadow-2xl">
            <h3 class="text-center font-bold text-slate-800 text-sm mb-1">Create Account</h3>
            
            <input type="text" id="su-fname" placeholder="First Name" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs">
            <input type="text" id="su-lname" placeholder="Last Name" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs">
            <input type="email" id="su-email" placeholder="Email (@bulsu.edu.ph)" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs">
            
            <div>
                <input type="password" id="su-pass" placeholder="Password (>8 chars & numbers)" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs">
                <span id="su-pass-error" class="text-[9px] text-red-500 hidden mt-1 block">Password must be >8 characters and contain numbers.</span>
            </div>

            <button onclick="handleSignUp()" class="w-full text-center bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow-md text-xs mt-2">
                Sign Up
            </button>
            <p class="text-center text-[10px] text-slate-500 pt-1">
                Already have an account? <a href="login.html" class="text-orange-600 font-bold">Log in</a>
            </p>
        </div>
    </div>

    <script src="app-ui.js"></script>
    <script>
        function handleSignUp() {
            let fname = document.getElementById('su-fname').value.trim();
            let lname = document.getElementById('su-lname').value.trim();
            let email = document.getElementById('su-email').value.trim();
            let pass = document.getElementById('su-pass').value;
            let errSpan = document.getElementById('su-pass-error');

            if(!fname || !lname || !email || !pass) {
                alert("Please fill in all personal and login details.");
                return;
            }

            let hasNumber = /\d/.test(pass);
            let isValidLength = pass.length > 8;

            if(!isValidLength || !hasNumber) {
                errSpan.classList.remove('hidden');
                document.getElementById('su-pass').style.borderColor = "#ef4444";
                return;
            }

            let registeredUsers = JSON.parse(localStorage.getItem('cc_registered_users') || '[]');
            if(registeredUsers.some(u => u.email === email)) {
                alert("An account with this email already exists! Please log in.");
                setTimeout(() => { window.location.href = "login.html"; }, 1800);
                return;
            }

            registeredUsers.push({ fname, lname, email, pass });
            localStorage.setItem('cc_registered_users', JSON.stringify(registeredUsers));
            localStorage.setItem('logged_customer_name', fname + " " + lname);
            localStorage.setItem('logged_customer_email', email);

            alert("Account created successfully!");
            setTimeout(() => { window.location.href = "customer.html"; }, 1800);
        }
    </script>
</body>
</html>
